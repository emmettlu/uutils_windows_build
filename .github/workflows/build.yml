name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Install Linux deps
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt install libssl-dev libsqlite3-dev pkg-config binfmt-support libxcursor-dev libx11-dev libasound2-dev libpulse-dev libwayland-dev libxkbcommon-dev

      - name: Windows Config
        if: matrix.os == 'windows-2022'
        run: |
          git config --system core.longpaths true
          echo "Enabled long paths in git"

          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force
          echo "Enabled long paths in registry"

          $git_link = "C:\Program Files\Git\usr\bin\link.exe"
          if (Test-Path $git_link) {
              Rename-Item $git_link "_link.exe"
          }
          echo "Removed link.exe in git"

      - name: Setup MSVC
        if: matrix.os == 'windows-2022'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          toolset: 14.29
          arch: x64
          sdk: 10.0.19041.0

      - name: Checkout self
        uses: actions/checkout@v6

      - name: Checkout target
        uses: actions/checkout@v6
        with:
          repository: project-robius/robrix
          ref: main
          path: robrix

      - name: Copy config file
        shell: bash
        run: |
          mkdir -p robrix/.cargo
          cp -f .cargo/config.toml robrix/.cargo

      - name: Build
        shell: pwsh
        run: |
          cd robrix
          cargo b -r

      - name: Archive
        uses: actions/upload-artifact@v5
        with:
          name: robrix_${{ matrix.os }}
          path: |
            robrix/target/release/*.exe
            robrix/target/release/*.dll
